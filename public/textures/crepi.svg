<svg xmlns="http://www.w3.org/2000/svg" width="350" height="350" viewBox="0 0 350 350">
  <filter id="crepi">
    <feTurbulence type="turbulence" baseFrequency="0.08" numOctaves="5" seed="5"/>
    <feColorMatrix type="saturate" values="0.3"/>
